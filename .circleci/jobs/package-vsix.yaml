!YS-v0:

docker:
- image: cimg/clojure:1.12.0-openjdk-21.0-node

working_directory: ~/calva

steps:
- !:attach-workspace /tmp

- !:cmd
  - Restore build
  - rmdir ~/calva && cp -r /tmp/build ~/calva

- !:bin Install Node

- !:cmd
  - Create artifacts workspace
  - mkdir /tmp/artifacts

- !:bin Package vsix

- !:cmd
  - Copy vsix
  - cp *.vsix /tmp/artifacts/

- !:store
    artifacts: /tmp/artifacts

- persist_to_workspace:
    root: /tmp
    paths:
    - artifacts
