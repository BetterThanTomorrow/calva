!YS-v0:

docker:
- image: cimg/clojure:1.11-browsers

working_directory: ~/calva

steps:
- !:attach-workspace /tmp

- !:cmd
  - Restore build
  - rmdir ~/calva && cp -r /tmp/build ~/calva

- install-node

- !:cmd
  - Apt install missing dependencies
  - sudo wget -q -O /etc/apt/trusted.gpg.d/google.asc https://dl.google.com/linux/linux_signing_key.pub && sudo apt update && sudo apt install -y libnss3

- !:cmd
  - Run VSIX Smoke Tests for test-data/projects/smoke-sub-projects
  - npm run smoke-test --
      --calva-vsix=/tmp/artifacts/calva-$(
          node -p 'require("./package.json").version'
        ).vsix
      --test-workspace=test-data/projects/smoke-sub-projects

- !:store
    test_results: ~/calva/junit
