!YS-v0:

docker:
- image: cimg/clojure:1.12.6-openjdk-21.0-browsers

parallelism: 3

working_directory: ~/calva

environment:
  JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1

steps:
- !:attach-workspace /tmp

- !:cmd
  - Restore build
  - rmdir ~/calva && cp -r /tmp/build ~/calva

- !:bin Install Node

- !:bin Write jack-in dependency versions

- restore_cache:
    name: Restore e2e dependencies
    keys:
    - e2e-deps-v1-{{ checksum "/tmp/jack-in-dependency-versions.json" }}-{{
               checksum "test-fixtures/deps.edn" }}-{{
               checksum "test-fixtures/projects/cljs-only/deps.edn" }}
    - e2e-deps-v1-

- !:cmd
  - Compile Extension Tests
  - npm run compile-test

- !:cmd
  - Apt install missing dependencies
  - sudo apt update && sudo apt install -y imagemagick

- !:cmd
  - Run Extension Tests
  - suites=$(circleci tests glob "$PWD/out/extension-test/e2e/suite/*-test.js" |
             circleci tests split --split-by=timings |
             xargs -n1 basename);
    echo "Running" $suites;
    npm run e2e-test -- --local $suites

- save_cache:
    name: Save e2e dependencies
    key: e2e-deps-v1-{{ checksum "/tmp/jack-in-dependency-versions.json" }}-{{
               checksum "test-fixtures/deps.edn" }}-{{
               checksum "test-fixtures/projects/cljs-only/deps.edn" }}
    paths:
    - ~/.m2
    - ~/.deps.clj
    - ~/.gitlibs

- !:store
    test_results: ~/calva/junit

- store_artifacts:
    path: ~/calva/junit
    destination: junit

- store_artifacts:
    path: ~/calva/out/extension-test/e2e/screenshots
    destination: e2e-screenshots
