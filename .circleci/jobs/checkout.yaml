!YS-v0:

docker:
- image: cimg/node:22.23.4

working_directory: ~/calva

steps:
- !:attach-workspace /tmp

- checkout:
    path: ~/calva

- restore_cache:
    name: Restore dependencies
    key: ts-{{ checksum "package.json" }}-cljs-{{
               checksum "shadow-cljs.edn" }}-grammar-{{
               checksum "clojure.tmLanguage.json" }}

- !:cmd
  - Install node_modules
  - cp package.json /tmp && npm install && cp /tmp/package.json .

- !:cmd
  - Create build workspace
  - mkdir /tmp/build

- !:cmd
  - Copy build
  - cp -r . /tmp/build

- save_cache:
    name: Save dependencies
    key: ts-{{ checksum "package.json" }}-cljs-{{
               checksum "shadow-cljs.edn" }}-grammar-{{
               checksum "clojure.tmLanguage.json" }}
    paths:
    - ./node_modules

- persist_to_workspace:
    root: /tmp
    paths:
    - build
