!YS-v0:
docker:
  - image: cimg/clojure:1.12.0-openjdk-21.0-node

working_directory: ~/calva

steps:
  - !:attach-workspace /tmp

  - !:cmd
    - Restore build
    - rmdir ~/calva && cp -r /tmp/build ~/calva

  - install-node

  - restore_cache:
      name: Restore CLJS dependencies
      keys:
      - cljs-deps-v1-{{ checksum "shadow-cljs.edn" }}-{{ checksum "deps.edn" }}
      - cljs-deps-v1-

  - !:cmd
    - Release CLJS test build
    - npx shadow-cljs release -A:ci:test :test

  - !:cmd
    - Verify CLJS test output
    - ls -l out/cljs-lib/test

  - !:cmd
    - Run CLJS Tests
    - npm run calva-lib-test

  - !:store
    test_results: ~/calva/junit

  # The vsix carries the test build, so package-vsix needs it
  - !:cmd
    - Copy test build
    - mkdir -p /tmp/build/out/cljs-lib && cp -r out/cljs-lib/test /tmp/build/out/cljs-lib

  - persist_to_workspace:
      root: /tmp
      paths:
      - build/out/cljs-lib/test
