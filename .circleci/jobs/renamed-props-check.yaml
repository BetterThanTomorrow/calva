!YS-v0:

docker:
- image: cimg/clojure:1.12.0-openjdk-21.0-node

working_directory: ~/calva

steps:
- !:attach-workspace /tmp

- !:cmd
  - Restore source and dependencies
  - rmdir ~/calva && cp -r /tmp/build ~/calva

- !:bin Install Node

- !:cmd
  - Install CLJS dependencies
  - npx shadow-cljs classpath

- !:cmd
  - Check the release builds for renamed JS property reads
  - clojure -M -i scripts/renamed_props.clj -e '(renamed-props/report! {})'
