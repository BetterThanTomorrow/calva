!YS-v0:

jobs:
- checkout:
    filters:
      tags:
        ignore: /^v\d+\.\d+\.\d+-?.*/

- prettier-check: {requires: [checkout]}
- build-cljslib:  {requires: [checkout]}
- package-vsix:   {requires: [build-cljslib, test-cljslib]}

- test-docs-builder

- ts-lint:               {requires: [checkout]}
- renamed-props-check:   {requires: [checkout]}
- test-cljslib:          {requires: [checkout]}
- test-e2e:              {requires: [build-cljslib]}
- test-smoke:              {requires: [package-vsix]}
- test-smoke-sub-projects: {requires: [package-vsix]}
- test-ts-unit:          {requires: [build-cljslib]}

- marketplace-preview-publish:
    requires:
    - package-vsix
    - prettier-check
    - ts-lint
    - renamed-props-check
    - test-cljslib
    - test-e2e
    - test-smoke
    - test-smoke-sub-projects
    - test-ts-unit
    filters:
      branches:
        # dev (disabled for now because
        # https://github.com/microsoft/vsmarketplace/issues/310)
        only: disabled
    context: Calva
