!YS-v0:

::
  defn filters(type='prerelease')::
    branches:
      ignore: /.*/
    tags:
      only::
        case type:
          'prerelease': '/^v\d+\.\d+\.\d+-?.*/'
          'release':    '/^v\d+\.\d+\.\d+$/'
          else: die("Unexpected filter type '$type'")

  build-test-jobs =: load('build-test.yaml').jobs

  not-in-release =: set(['test-docs-builder' 'marketplace-preview-publish'])

  # A release first builds and checks like build-test does. CircleCI
  # needs the tag filter on every job a tag-filtered job waits for.
  release-checks =:
    (for [job build-test-jobs
          :let [[name opts] (if (map? job) (first job) [job {}])]
          :when (not (not-in-release name))]
      {name (assoc opts "filters" (filters))})

  # The release waits for what a preview publish would wait for
  checks-passed =:
    some _ build-test-jobs:
      fn(job): get-in(job ["marketplace-preview-publish" "requires"])

jobs::
  concat release-checks::
  - github-release:
      requires:: checks-passed
      filters:: filters()
      context: Calva

  - marketplace-publish:
      requires: [github-release]
      filters:: filters('release')
      context: Calva

  - open-vsx-publish:
      requires: [github-release]
      filters:: filters('release')
      context: Calva

  - merge-dev-into-published:
      requires: [marketplace-publish]
      filters:: filters('release')
      context: Calva

  - bump-dev-version:
      requires: [merge-dev-into-published]
      filters:: filters('release')
      context: Calva
