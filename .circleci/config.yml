            GHR_CMD='echo'
          else
            GHR_CMD=ghr
          fi

          $GHR_CMD -t "$GITHUB_TOKEN" \
            "${EXTRA_RELEASE_OPTIONS[@]}" \
            -u "$CIRCLE_PROJECT_USERNAME" \
            -r "$CIRCLE_PROJECT_REPONAME" \
